<svg xmlns="http://www.w3.org/2000/svg" width="740" height="278" viewBox="0 0 740 278" role="img" aria-labelledby="t d">
  <title id="t">AUV bring-up and survey log</title>
  <desc id="d">ansible-playbook auv-bringup.yml — vehicle up 95% faster, GPS-denied DVL navigation, 1412 sonar pings georeferenced to XTF, survey complete with zero interventions.</desc>

  <style>
    /* Ayu Dark, as shipped in Ghostty */
    .m  { font-family: "JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace; font-size: 14px }
    .fg { fill: #bfbdb6 } .dm { fill: #686868 } .gn { fill: #aad94c }
    .or { fill: #ffb454 } .bl { fill: #59c2ff } .cy { fill: #95e6cb }

    .line { opacity: 0; animation: in .01s linear forwards }
    .l1 { animation-delay: 1.45s } .l2 { animation-delay: 1.57s }
    .l3 { animation-delay: 1.69s } .l4 { animation-delay: 1.81s }
    .l5 { animation-delay: 1.93s } .l6 { animation-delay: 2.05s }
    .l7 { animation-delay: 2.20s } .l8 { animation-delay: 2.40s }

    .mask { animation: type 1.06s steps(48) .20s forwards }
    .k1 { opacity: 0; animation: in .01s linear .20s forwards, type 1.06s steps(48) .20s forwards,
                                 blink .9s steps(2) .20s infinite, out .01s linear 1.30s forwards }
    .k2 { opacity: 0; animation: in .01s linear 2.40s forwards, blink .9s steps(2) 2.40s infinite }
    .ping { opacity: 0; animation: in .01s linear 1.93s forwards, sweep 2.2s ease-in-out 2.0s infinite }

    @keyframes in    { to { opacity: 1 } }
    @keyframes out   { to { opacity: 0 } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes sweep { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
    @keyframes type  { to { transform: translateX(403px) } }

    @media (prefers-reduced-motion: reduce) {
      .line, .ping { opacity: 1; animation: none }
      .mask { transform: translateX(403px); animation: none }
      .k1 { opacity: 0; animation: none }
      .k2 { opacity: 1; animation: none }
    }
  </style>

  <rect width="740" height="278" rx="10" fill="#0b0e14"/>
  <rect width="740" height="34" rx="10" fill="#11151c"/>
  <rect y="24" width="740" height="10" fill="#11151c"/>
  <text class="m dm" x="370" y="22" text-anchor="middle" style="font-size:12px">ivan@hull-02: ~/dives/041</text>

  <text class="m" x="20" y="64" xml:space="preserve"><tspan class="bl">$</tspan> <tspan class="gn">ansible-playbook</tspan><tspan class="fg"> auv-bringup.yml --limit hull-02</tspan></text>
  <rect class="mask" x="36" y="50" width="430" height="19" fill="#0b0e14"/>
  <rect class="k1" x="36" y="51" width="8" height="17" fill="#e6b450"/>

  <text class="m line l1" x="20" y="92"  xml:space="preserve"><tspan class="gn">[ OK ]</tspan> <tspan class="fg">jetson flashed · docker workspace up · pixhawk configured — </tspan><tspan class="or">95%</tspan><tspan class="fg"> faster</tspan></text>
  <text class="m line l2" x="20" y="114" xml:space="preserve"><tspan class="dm">[INFO] [nats]      </tspan><tspan class="fg">DVL + INS subscribed · </tspan><tspan class="or">0</tspan><tspan class="fg"> dropped messages</tspan></text>
  <text class="m line l3" x="20" y="136" xml:space="preserve"><tspan class="dm">[INFO] [ekf]       </tspan><tspan class="fg">GPS denied — dead reckoning on DVL bottom lock</tspan></text>
  <text class="m line l4" x="20" y="158" xml:space="preserve"><tspan class="or">[WARN]</tspan> <tspan class="dm">[buoyancy]  </tspan><tspan class="fg">CAN </tspan><tspan class="or">0x1A4</tspan><tspan class="fg"> solenoid duty 68% — holding depth </tspan><tspan class="or">±0.3 m</tspan></text>
  <text class="m line l5" x="20" y="180" xml:space="preserve"><tspan class="dm">[INFO] [sonar]     </tspan><tspan class="fg">side-scan SDS → XTF · </tspan><tspan class="or">1,412</tspan><tspan class="fg"> pings georeferenced  </tspan><tspan class="cy ping">▁▃▅▇▅▃▁</tspan></text>
  <text class="m line l6" x="20" y="202" xml:space="preserve"><tspan class="dm">[INFO] [mission]   </tspan><tspan class="fg">surfaced for GPS fix — accumulated drift reset</tspan></text>
  <text class="m line l7" x="20" y="228" xml:space="preserve"><tspan class="gn">[ OK ]</tspan> <tspan class="fg">survey complete · seabed mosaic written · </tspan><tspan class="or">0</tspan><tspan class="fg"> interventions</tspan></text>

  <text class="m line l8 bl" x="20" y="256">$</text>
  <rect class="k2" x="36" y="243" width="8" height="17" fill="#e6b450"/>
</svg>
